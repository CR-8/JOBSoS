# =============================================================================
# CareerHub - Coolify-Optimized Docker Compose
# =============================================================================
# Differs from docker-compose.yml:
#   - Removes Traefik (Coolify brings its own reverse proxy)
#   - Exposes each public service on unique host ports (for direct/debug access)
#   - Routing is done via explicit Traefik labels on each service (hardcoded
#     below), NOT via Coolify's SERVICE_FQDN_* magic env vars — that field
#     silently truncates any path suffix (e.g. "/resume") on save in some
#     Coolify versions, which breaks path-based routing. Labels are
#     deterministic and don't depend on that UI field at all.
#   - Dashboard rewrites route to internal Docker network (unchanged)
#
# Coolify Setup:
#   1. Deploy this file as a "Docker Compose" resource
#   2. Set DOMAIN in the resource's env vars (e.g. careerhub.example.com)
#      Routing is derived entirely from DOMAIN via the labels below:
#      ┌──────────────────────────┬──────────────────────────┬───────────┐
#      │ Service              │ Domain/Path             │ Port     │
#      ├──────────────────────────┼──────────────────────────┼───────────┤
#      │ dashboard           │ ${DOMAIN} /               │ 3000     │
#      │ reactive-resume     │ ${DOMAIN} /resume/*        │ 3003 │
#      │ jobops              │ ${DOMAIN} /jobs/*          │ 3005 │
#      │ resume-sync-api     │ ${DOMAIN} /api/*           │ 8010 │
#      │ authentik-server    │ auth.${DOMAIN}             │ 9090 │
#      └──────────────────────────┴──────────────────────────┴───────────┘
#      Use a SUBDOMAIN for Authentik (auth.*) — sub-path routing (/auth/*)
#      is not supported by Authentik.
#   3. Leave SERVICE_FQDN_* / SERVICE_URL_* env vars blank — they're unused
#      now that routing is hardcoded via labels. Setting them risks Coolify
#      generating a second, conflicting (and possibly broken) router.
#   4. Dashboard's NEXT_PUBLIC_* routing env vars are already hardcoded
#      below (API_URL=/api, RESUME_URL=/resume, JOBS_URL=/jobs,
#      AUTH_URL=https://auth.${DOMAIN}) — no manual Coolify config needed.
# =============================================================================

name: careerhub

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  careerhub-net:
    driver: bridge
    name: careerhub-net

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: careerhub-postgres
  redis_data:
    name: careerhub-redis
  authentik_db:
    name: careerhub-authentik-db
  authentik_media:
    name: careerhub-authentik-media
  authentik_certs:
    name: careerhub-authentik-certs
  authentik_redis:
    name: careerhub-authentik-redis
  rr_data:
    name: careerhub-rr-data
  jobops_data:
    name: careerhub-jobops-data
  jobops_codex:
    name: careerhub-jobops-codex
  sync_db:
    name: careerhub-sync-db
  traefik_certs:
    name: careerhub-traefik-certs

# =============================================================================
# Services
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: careerhub-cf-postgres
    restart: unless-stopped
    networks:
      - careerhub-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis - Shared cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: careerhub-cf-redis
    restart: unless-stopped
    networks:
      - careerhub-net
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Postgres DB bootstrap - idempotent, runs on every deploy.
  # init.sql only fires on a truly empty volume, so on a volume that already
  # has data (e.g. from an earlier failed deploy) the app databases never get
  # created. This creates any that are missing every time, safely.
  # ---------------------------------------------------------------------------
  postgres-init:
    image: postgres:17-alpine
    container_name: careerhub-cf-postgres-init
    restart: "no"
    networks:
      - careerhub-net
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: >
      /bin/sh -c "
        set -e;
        for db in reactive_resume jobops resume_sync authentik; do
          exists=$$(psql -h postgres -U ${POSTGRES_USER} -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='$$db'\");
          if [ \"$$exists\" = \"1\" ]; then
            echo \"Database $$db already exists\";
          else
            echo \"Creating database $$db\";
            psql -h postgres -U ${POSTGRES_USER} -d postgres -c \"CREATE DATABASE $$db\";
          fi;
        done
      "
    depends_on:
      postgres:
        condition: service_healthy

  # ===========================================================================
  # Authentik - Single Sign-On
  # ===========================================================================
  authentik-redis:
    image: redis:7-alpine
    container_name: careerhub-cf-authentik-redis
    restart: unless-stopped
    networks:
      - careerhub-net
    command: redis-server --save 60 1 --dbfilename dump-authentik.rdb --loglevel warning
    volumes:
      - authentik_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2025.6}
    container_name: careerhub-cf-authentik-server
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.careerhub-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.careerhub-authentik-http.rule=Host(`auth.${DOMAIN:-careerhub.local}`)"
      - "traefik.http.routers.careerhub-authentik-http.entrypoints=http"
      - "traefik.http.routers.careerhub-authentik-http.middlewares=careerhub-https-redirect"
      - "traefik.http.routers.careerhub-authentik.rule=Host(`auth.${DOMAIN:-careerhub.local}`)"
      - "traefik.http.routers.careerhub-authentik.entrypoints=https"
      - "traefik.http.routers.careerhub-authentik.tls=true"
      - "traefik.http.routers.careerhub-authentik.tls.certresolver=letsencrypt"
      - "traefik.http.services.careerhub-authentik.loadbalancer.server.port=9000"
    networks:
      - careerhub-net
    command: server
    ports:
      - "9090:9000"
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
    volumes:
      - authentik_media:/media
      - authentik_certs:/certs
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      authentik-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2025.6}
    container_name: careerhub-cf-authentik-worker
    restart: unless-stopped
    networks:
      - careerhub-net
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik
    volumes:
      - authentik_media:/media
      - authentik_certs:/certs
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      authentik-redis:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # Reactive Resume
  # ===========================================================================
  reactive-resume:
    image: ghcr.io/amruthpillai/reactive-resume:latest
    container_name: careerhub-cf-reactive-resume
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.careerhub-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.careerhub-resume-http.rule=Host(`${DOMAIN:-careerhub.local}`) && PathPrefix(`/resume`)"
      - "traefik.http.routers.careerhub-resume-http.entrypoints=http"
      - "traefik.http.routers.careerhub-resume-http.priority=10"
      - "traefik.http.routers.careerhub-resume-http.middlewares=careerhub-https-redirect"
      - "traefik.http.routers.careerhub-resume.rule=Host(`${DOMAIN:-careerhub.local}`) && PathPrefix(`/resume`)"
      - "traefik.http.routers.careerhub-resume.entrypoints=https"
      - "traefik.http.routers.careerhub-resume.priority=10"
      - "traefik.http.routers.careerhub-resume.tls=true"
      - "traefik.http.routers.careerhub-resume.tls.certresolver=letsencrypt"
      - "traefik.http.services.careerhub-resume.loadbalancer.server.port=3000"
    networks:
      - careerhub-net
    ports:
      - "3003:3000"
    environment:
      PORT: "3000"
      APP_URL: "${APP_URL:-https://${DOMAIN:-careerhub.local}}/resume"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/reactive_resume"
      REDIS_URL: "redis://redis:6379/0"
      AUTH_SECRET: "${RR_AUTH_SECRET}"
      ENCRYPTION_SECRET: "${RR_ENCRYPTION_SECRET}"
      # No S3_* vars set -> Reactive Resume falls back to local filesystem
      # storage at /app/data (backed by the rr_data volume below).
      OAUTH_PROVIDER_NAME: "${OAUTH_PROVIDER_NAME:-CareerHub SSO}"
      OAUTH_CLIENT_ID: "${RR_OIDC_CLIENT_ID}"
      OAUTH_CLIENT_SECRET: "${RR_OIDC_CLIENT_SECRET}"
      OAUTH_DISCOVERY_URL: "${OAUTH_DISCOVERY_URL}"
      OAUTH_SCOPES: "openid profile email"
      FLAG_DISABLE_SIGNUPS: "${RR_DISABLE_SIGNUPS:-true}"
      FLAG_SHOW_SPONSORS: "false"
    volumes:
      - rr_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # JobOps
  # ===========================================================================
  jobops:
    image: ghcr.io/dakheera47/job-ops:latest
    container_name: careerhub-cf-jobops
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.careerhub-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.careerhub-jobops-http.rule=Host(`${DOMAIN:-careerhub.local}`) && PathPrefix(`/jobs`)"
      - "traefik.http.routers.careerhub-jobops-http.entrypoints=http"
      - "traefik.http.routers.careerhub-jobops-http.priority=10"
      - "traefik.http.routers.careerhub-jobops-http.middlewares=careerhub-https-redirect"
      - "traefik.http.routers.careerhub-jobops.rule=Host(`${DOMAIN:-careerhub.local}`) && PathPrefix(`/jobs`)"
      - "traefik.http.routers.careerhub-jobops.entrypoints=https"
      - "traefik.http.routers.careerhub-jobops.priority=10"
      - "traefik.http.routers.careerhub-jobops.tls=true"
      - "traefik.http.routers.careerhub-jobops.tls.certresolver=letsencrypt"
      - "traefik.http.services.careerhub-jobops.loadbalancer.server.port=3001"
    networks:
      - careerhub-net
    ports:
      - "3005:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      PYTHON_PATH: "/usr/bin/python3"
      CODEX_HOME: "/app/codex-home"
      BASIC_AUTH_USER: "${JOBOPS_AUTH_USER:-admin}"
      BASIC_AUTH_PASSWORD: "${JOBOPS_AUTH_PASSWORD:-changeme}"
      JOBOPS_PUBLIC_BASE_URL: "${APP_URL:-https://${DOMAIN:-careerhub.local}}/jobs"
      RXRESUME_API_KEY: "${RXRESUME_API_KEY:-}"
      RXRESUME_URL: "http://reactive-resume:3000"
    volumes:
      - jobops_data:/app/data
      - jobops_codex:/app/codex-home
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # Resume Sync API
  # ===========================================================================
  resume-sync-api:
    build:
      context: ./resume-sync-api
      dockerfile: Dockerfile
    container_name: careerhub-cf-resume-sync
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.careerhub-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.careerhub-syncapi-http.rule=Host(`${DOMAIN:-careerhub.local}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.careerhub-syncapi-http.entrypoints=http"
      - "traefik.http.routers.careerhub-syncapi-http.priority=10"
      - "traefik.http.routers.careerhub-syncapi-http.middlewares=careerhub-https-redirect"
      - "traefik.http.routers.careerhub-syncapi.rule=Host(`${DOMAIN:-careerhub.local}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.careerhub-syncapi.entrypoints=https"
      - "traefik.http.routers.careerhub-syncapi.priority=10"
      - "traefik.http.routers.careerhub-syncapi.tls=true"
      - "traefik.http.routers.careerhub-syncapi.tls.certresolver=letsencrypt"
      - "traefik.http.services.careerhub-syncapi.loadbalancer.server.port=8000"
    networks:
      - careerhub-net
    ports:
      - "8010:8000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/resume_sync"
      REDIS_URL: "redis://redis:6379/1"
      REACTIVE_RESUME_URL: "http://reactive-resume:3000"
      REACTIVE_RESUME_API_KEY: "${RR_SYNC_API_KEY:-}"
      JOBOPS_URL: "http://jobops:3001"
      JOBOPS_AUTH_USER: "${JOBOPS_AUTH_USER:-admin}"
      JOBOPS_AUTH_PASSWORD: "${JOBOPS_AUTH_PASSWORD:-changeme}"
      JWT_SECRET: "${SYNC_JWT_SECRET}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      reactive-resume:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ===========================================================================
  # CareerHub Dashboard
  # ===========================================================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: careerhub-cf-dashboard
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.careerhub-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.careerhub-dashboard-http.rule=Host(`${DOMAIN:-careerhub.local}`)"
      - "traefik.http.routers.careerhub-dashboard-http.entrypoints=http"
      - "traefik.http.routers.careerhub-dashboard-http.priority=1"
      - "traefik.http.routers.careerhub-dashboard-http.middlewares=careerhub-https-redirect"
      - "traefik.http.routers.careerhub-dashboard.rule=Host(`${DOMAIN:-careerhub.local}`)"
      - "traefik.http.routers.careerhub-dashboard.entrypoints=https"
      - "traefik.http.routers.careerhub-dashboard.priority=1"
      - "traefik.http.routers.careerhub-dashboard.tls=true"
      - "traefik.http.routers.careerhub-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.careerhub-dashboard.loadbalancer.server.port=3000"
    networks:
      - careerhub-net
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "/api"
      NEXT_PUBLIC_RESUME_URL: "/resume"
      NEXT_PUBLIC_JOBS_URL: "/jobs"
      NEXT_PUBLIC_AUTH_URL: "https://auth.${DOMAIN:-careerhub.local}"
      NEXT_PUBLIC_DOMAIN: "${DOMAIN:-careerhub.local}"
      SYNC_API_URL: "http://resume-sync-api:8000"
      AUTHENTIK_URL: "http://authentik-server:9000"
      AUTHENTIK_CLIENT_ID: "${DASHBOARD_OIDC_CLIENT_ID}"
      AUTHENTIK_CLIENT_SECRET: "${DASHBOARD_OIDC_CLIENT_SECRET}"
    depends_on:
      resume-sync-api:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
